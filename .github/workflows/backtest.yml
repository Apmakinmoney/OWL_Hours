name: Weekly backtest

on:
  schedule:
    - cron: "10 15 * * 6"     # Saturdays, mid-morning Central
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research tools
        run: pip install numpy scikit-learn arch mapie
      - name: Run the backtest (about 8 minutes of downloads)
        run: python backtest_job.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save backtest.json
        run: bash .github/push.sh "Weekly backtest" backtest.json
