name: Crypto hourly

on:
  schedule:
    # Every hour, every day: crypto trades around the clock.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch crypto prices
        run: python crypto_job.py
      - name: Save crypto.json
        run: bash .github/push.sh "Update crypto" crypto.json
